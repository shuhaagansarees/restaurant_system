<!-- Customer History Modal -->
<div id="customerHistoryModal" style=" position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center;">
    <div style="background: white; border-radius: 8px; width: 500px; max-width: 90%; max-height: 90vh; display: flex; flex-direction: column;">
        <div style="padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0;">Customer History</h3>
            <button onclick="closeCustomerHistory()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer;">&times;</button>
        </div>
        <div id="customerHistoryBody" style="padding: 15px; overflow-y: auto; flex-grow: 1;">
            Loading...
        </div>
    </div>
</div>

<style>
.autocomplete-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}
.autocomplete-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background: white;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    z-index: 1000;
    max-height: 200px;
    overflow-y: auto;
    display: none;
}
.autocomplete-item {
    padding: 10px;
    cursor: pointer;
    border-bottom: 1px solid #f1f5f9;
}
.autocomplete-item:hover {
    background: #f8fafc;
}
</style>

<script>
function setupCustomerAutocomplete(mobileInputId, nameInputId) {
    const mobileInput = document.getElementById(mobileInputId);
    const nameInput = document.getElementById(nameInputId);
    
    if (!mobileInput) return;
    
    // Create wrapper if not exists
    if (!mobileInput.parentElement.classList.contains('autocomplete-wrapper')) {
        const wrapper = document.createElement('div');
        wrapper.className = 'autocomplete-wrapper';
        mobileInput.parentNode.insertBefore(wrapper, mobileInput);
        wrapper.appendChild(mobileInput);
        
        // Add history button
        const historyBtn = document.createElement('button');
        historyBtn.type = 'button';
        historyBtn.innerHTML = '<i class="fa fa-history"></i>';
        historyBtn.style.cssText = 'margin-left: 5px; padding: 8px 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer;';
        historyBtn.onclick = () => openCustomerHistory(mobileInput.value);
        wrapper.appendChild(historyBtn);
        
        // Add dropdown
        const dropdown = document.createElement('div');
        dropdown.className = 'autocomplete-dropdown';
        wrapper.appendChild(dropdown);
        
        let debounceTimer;
        
        mobileInput.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            const val = this.value.trim();
            if (val.length < 4) {
                dropdown.style.display = 'none';
                return;
            }
            
            debounceTimer = setTimeout(async () => {
                try {
                    const resp = await fetch('/api/customer/autocomplete?q=' + encodeURIComponent(val));
                    const data = await resp.json();
                    
                    if (data.length > 0) {
                        dropdown.innerHTML = '';
                        data.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'autocomplete-item';
                            div.innerHTML = `<strong>${item.mobile}</strong> - ${item.name || 'Unknown'}`;
                            div.onclick = () => {
                                mobileInput.value = item.mobile;
                                if (nameInput) nameInput.value = item.name;
                                dropdown.style.display = 'none';
                            };
                            dropdown.appendChild(div);
                        });
                        dropdown.style.display = 'block';
                    } else {
                        dropdown.style.display = 'none';
                    }
                } catch (e) {
                    console.error(e);
                }
            }, 300);
        });
        
        document.addEventListener('click', function(e) {
            if (!wrapper.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });
    }
}

async function openCustomerHistory(mobile) {
    mobile = mobile.trim();
    if (!mobile) {
        alert("Please enter a mobile number first.");
        return;
    }
    
    const modal = document.getElementById('customerHistoryModal');
    const body = document.getElementById('customerHistoryBody');
    
    modal.classList.add('active'); modal.style.display = '';
    body.innerHTML = 'Loading customer history...';
    
    try {
        const resp = await fetch('/api/customer/history?mobile=' + encodeURIComponent(mobile));
        const data = await resp.json();
        
        if (!data.success) {
            body.innerHTML = `<div style="color: red; text-align: center; padding: 20px;">${data.message}</div>`;
            return;
        }
        
        let ordersHtml = '';
        if (data.recent_orders.length > 0) {
            ordersHtml = `<table style="width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem;">
                <tr style="background: #f8fafc; border-bottom: 2px solid var(--border-color);">
                    <th style="padding: 8px; text-align: left;">Date</th>
                    <th style="padding: 8px; text-align: left;">Items</th>
                    <th style="padding: 8px; text-align: right;">Total</th>
                </tr>`;
            data.recent_orders.forEach(o => {
                ordersHtml += `<tr style="border-bottom: 1px solid #f1f5f9;">
                    <td style="padding: 8px; white-space: nowrap;">${o.date}</td>
                    <td style="padding: 8px; color: var(--text-secondary);">${o.items}</td>
                    <td style="padding: 8px; text-align: right; font-weight: 500;">₹${o.total.toFixed(2)}</td>
                </tr>`;
            });
            ordersHtml += `</table>`;
        } else {
            ordersHtml = '<p style="color: var(--text-secondary);">No completed orders found.</p>';
        }
        
        body.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #f8fafc; padding: 15px; border-radius: 8px;">
                <div>
                    <h2 style="margin: 0; color: var(--brand-blue);">${data.name}</h2>
                    <div style="color: var(--text-secondary); margin-top: 5px;"><i class="fa fa-phone"></i> ${data.mobile}</div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 0.9rem; color: var(--text-secondary);">Visits</div>
                    <div style="font-size: 1.5rem; font-weight: bold;">${data.visits}</div>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div style="border: 1px solid var(--border-color); padding: 10px; border-radius: 6px;">
                    <div style="font-size: 0.8rem; color: var(--text-secondary);">Max Ordered Item</div>
                    <div style="font-weight: 600; margin-top: 5px;">${data.max_ordered}</div>
                </div>
                <div style="border: 1px solid var(--border-color); padding: 10px; border-radius: 6px;">
                    <div style="font-size: 0.8rem; color: var(--text-secondary);">Average Bill</div>
                    <div style="font-weight: 600; margin-top: 5px; color: var(--brand-orange);">₹${data.avg_bill}</div>
                </div>
                <div style="border: 1px solid var(--border-color); padding: 10px; border-radius: 6px;">
                    <div style="font-size: 0.8rem; color: var(--text-secondary);">Loyalty Points</div>
                    <div style="font-weight: 600; margin-top: 5px; color: #10b981;">⭐ ${data.loyalty_points || 0}</div>
                </div>
                <div style="border: 1px solid var(--border-color); padding: 10px; border-radius: 6px;">
                    <div style="font-size: 0.8rem; color: var(--text-secondary);">Coming Since</div>
                    <div style="font-weight: 600; margin-top: 5px;">${data.coming_since}</div>
                </div>
            </div>
            
            <h4 style="margin: 0 0 10px 0; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;">Recent Orders (Max 25)</h4>
            ${ordersHtml}
        `;
        
    } catch (e) {
        console.error(e);
        body.innerHTML = `<div style="color: red; text-align: center; padding: 20px;">Network error loading history.</div>`;
    }
}

function closeCustomerHistory() {
    document.getElementById('customerHistoryModal').style.display = 'none';
}
</script>
